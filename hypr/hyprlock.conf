# Hyprlock - Pure Monochrome Configuration

general {
    ignore_empty_input = true
    hide_cursor = true
}

background {
    monitor = 
    path = screenshot
    color = rgba(000000ee)
    blur_size = 10
    blur_passes = 3
}

animations {
    enabled = true
}

input-field {
    monitor =
    size = 280, 50
    position = 0, 0
    halign = center
    valign = center

    inner_color = rgba(0, 0, 0, 0)
    outer_color = rgba(0, 0, 0, 0)
    outline_thickness = 0

    font_family = JetBrainsMono Nerd Font
    font_color = rgba(ffffffff)

    placeholder_text = Enter Password
    check_color = rgba(ffffffff)
    fail_text = <i>$FAIL ($ATTEMPTS)</i>

    rounding = 0
    shadow_passes = 0
    fade_on_empty = false
}

auth {
    fingerprint {
        enabled = true
    }
}
