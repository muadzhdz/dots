# Rice dictation config (voxtype)
# English + Indonesian, Whisper small model, push-to-talk via F9

[hotkey]
enabled = false

[whisper]
model = "small"
language = ["en", "id"]

[audio]
device = "pipewire"
sample_rate = 16000
max_duration_secs = 60

[audio.feedback]
enabled = true
theme = "default"
volume = 0.7

[output]
mode = "type"
fallback_to_clipboard = true
driver_order = ["wtype", "dotool", "ydotool", "clipboard"]