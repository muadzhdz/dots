# Rice dictation config (voxtype)
# Multilingual (English + Indonesian), Whisper small model, push-to-talk via F9

[hotkey]
enabled = false

[whisper]
model = "small"
language = "auto"

[audio]
device = "pipewire"
sample_rate = 16000
max_duration_secs = 60

[audio.feedback]
enabled = false

[osd]
enabled = true
frontend = "gtk4"
position = "top-center"
waveform_gain = 8.0

[output]
mode = "type"
fallback_to_clipboard = true
driver_order = ["wtype", "dotool", "ydotool", "clipboard"]
